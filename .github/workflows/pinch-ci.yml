name: Pinch CI

on:
  push:
    branches: [main]

concurrency:
  group: pinch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: ./scripts/build-app.sh release
